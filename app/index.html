<head>
<meta charset="utf-8">

<meta name="theme-color" content="#20252B">
<meta name="google-adsense-account" content="ca-pub-1016489685314516">
<meta name="description" content="Buzzworks, a cozy idle honey tycoon. Build your hive, hatch bees, open new worlds.">
<title>Buzzworks</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="splash" id="splash">
  <div class="sp-bg"></div>
  <div class="sp-stage">
    <span class="sp-glow"></span>
    <span class="sp-ring"></span>
    <span class="sp-icon" id="splashIcon"><img src="assets/icon.svg" alt=""></span>
    <span class="sp-orbit o1"><i><svg viewBox="0 0 40 32" width="30" height="24" aria-hidden="true"><g class="wg"><ellipse cx="15" cy="9" rx="6" ry="8" transform="rotate(-25 15 9)" fill="#F5F3EF" opacity="0.85"/><ellipse cx="23" cy="8" rx="5" ry="7" transform="rotate(20 23 8)" fill="#F5F3EF" opacity="0.85"/></g><ellipse cx="18" cy="20" rx="12" ry="9" fill="#F2C14E"/><rect x="12" y="11" width="3.5" height="18" fill="#20252B"/><rect x="19" y="11" width="3.5" height="18" fill="#20252B"/><circle cx="31" cy="18" r="6" fill="#20252B"/><circle cx="33" cy="16" r="1.6" fill="#fff"/><path d="M6 20 1 21.5 6 23Z" fill="#20252B"/></svg></i></span>
    <span class="sp-orbit o2"><i><svg viewBox="0 0 40 32" width="30" height="24" aria-hidden="true"><g class="wg"><ellipse cx="15" cy="9" rx="6" ry="8" transform="rotate(-25 15 9)" fill="#F5F3EF" opacity="0.85"/><ellipse cx="23" cy="8" rx="5" ry="7" transform="rotate(20 23 8)" fill="#F5F3EF" opacity="0.85"/></g><ellipse cx="18" cy="20" rx="12" ry="9" fill="#F2C14E"/><rect x="12" y="11" width="3.5" height="18" fill="#20252B"/><rect x="19" y="11" width="3.5" height="18" fill="#20252B"/><circle cx="31" cy="18" r="6" fill="#20252B"/><circle cx="33" cy="16" r="1.6" fill="#fff"/><path d="M6 20 1 21.5 6 23Z" fill="#20252B"/></svg></i></span>
    <span class="sp-orbit o3"><i><svg viewBox="0 0 40 32" width="30" height="24" aria-hidden="true"><g class="wg"><ellipse cx="15" cy="9" rx="6" ry="8" transform="rotate(-25 15 9)" fill="#F5F3EF" opacity="0.85"/><ellipse cx="23" cy="8" rx="5" ry="7" transform="rotate(20 23 8)" fill="#F5F3EF" opacity="0.85"/></g><ellipse cx="18" cy="20" rx="12" ry="9" fill="#F2C14E"/><rect x="12" y="11" width="3.5" height="18" fill="#20252B"/><rect x="19" y="11" width="3.5" height="18" fill="#20252B"/><circle cx="31" cy="18" r="6" fill="#20252B"/><circle cx="33" cy="16" r="1.6" fill="#fff"/><path d="M6 20 1 21.5 6 23Z" fill="#20252B"/></svg></i></span>
  </div>
  <b class="sp-title"><span>Buzz</span>works</b>
  <div class="bar"><i></i></div>
  <small class="load-label" id="loadLabel">Loading</small>
  <p class="tip" id="splashTip"></p>
  <button class="btn btn-primary btn-lg play hidden" id="playBtn"></button>
  <span class="powered" id="powered"></span>
</div>
<div id="app">
  <header class="topbar">
    <button class="icon-btn phone-only" id="menuBtn" aria-label="Menu"></button>
    <div class="brand" id="brand"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="chips">
      <button class="chip gchip" id="chipCloud" style="display:none"></button>
      <button class="chip lvl" id="chipLevel"></button>
      <span class="chip jelly" id="chipJelly"></span>
      <button class="chip tickets" id="chipTickets"></button>
    </div>
  </header>
  <aside class="drawer" id="drawer"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="layout">
    <section class="stage" id="stage">
      <canvas id="scene"></canvas>
      <div class="hud">
        <div class="honey"><b id="honeyAmt" class="num">0</b><small id="hpsAmt" class="num"></small></div>
        <div class="rushbar hidden" id="rushBar"></div>
        <div class="buffs" id="buffs"></div>
      </div>
      <div class="combo" id="combo"><i></i><span></span></div>
      <div class="hint hidden" id="hint"></div>
      <div class="stage-btns" id="stageBtns"></div>
    </section>
    <section class="panel" id="panel"></section>
  </main>
  <div class="toasts" id="toasts"></div>
  <div class="modal-wrap hidden" id="modal"></div>
</div>

<script src="src/ui4.js"></script>
<script src="src/worldmap.js"></script>
<script src="src/dev.js"></script>

<script src="src/chatfilter.js"></script>
<script src="src/event.js"></script>
<script src="src/community.js"></script>
<script src="src/welcome.js"></script>
<script src="src/main.js"></script>
</body>
</html>
